name: QA Reimplementation Checks

on:
  push:
    branches:
      - agent/reimplement-qa-readiness
  pull_request:
    paths:
      - "26s-cst8319-330-group-08/backend/**"
      - "26s-cst8319-330-group-08/frontend/**"
      - "26s-cst8319-330-group-08/sql/**"
      - ".github/workflows/qa-reimplementation-checks.yml"

permissions:
  contents: read

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 26s-cst8319-330-group-08/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 26s-cst8319-330-group-08/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend checks
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 26s-cst8319-330-group-08/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 26s-cst8319-330-group-08/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
