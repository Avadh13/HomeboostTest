name: Debug Employer Approval Frontend

on:
  pull_request:
    paths:
      - "26s-cst8319-330-group-08/frontend/**"
      - ".github/workflows/debug-employer-approval-frontend.yml"

jobs:
  capture-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 26s-cst8319-330-group-08/frontend/package-lock.json

      - name: Install dependencies
        working-directory: 26s-cst8319-330-group-08/frontend
        run: npm ci

      - name: Capture build output
        id: build
        working-directory: 26s-cst8319-330-group-08/frontend
        shell: bash
        run: |
          set +e
          npm run build > frontend-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employer-approval-frontend-build-log
          path: 26s-cst8319-330-group-08/frontend/frontend-build.log
          if-no-files-found: error

      - name: Fail when build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
